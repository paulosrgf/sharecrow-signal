[package]
name = "sharecrow-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
rand = "0.9" # Ou 0.8, a trait `rand::Rng` cobrirá ambos
uuid = { version = "1.0", features = ["v4"] }

